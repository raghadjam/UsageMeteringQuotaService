services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-usage_metering}
      POSTGRES_USER: ${POSTGRES_USER:-usage_metering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./loadtest/audit.sql:/scripts/audit.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-usage_metering}:${POSTGRES_PASSWORD:-local_dev_password}@db:5432/${POSTGRES_DB:-usage_metering}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-compose-admin-key-change-this}
      CONSUMPTION_STRATEGY: ${CONSUMPTION_STRATEGY:-locking}
      DB_POOL_MAX: ${DB_POOL_MAX:-50}
      API_KEY_CACHE_ENABLED: ${API_KEY_CACHE_ENABLED:-true}
      CONSUME_LOCK_TIMEOUT_MS: ${CONSUME_LOCK_TIMEOUT_MS:-1000}
      CONSUME_STATEMENT_TIMEOUT_MS: ${CONSUME_STATEMENT_TIMEOUT_MS:-30000}
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  demo-client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      API_URL: http://api:3000/v1
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-compose-admin-key-change-this}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  k6:
    image: grafana/k6:0.55.0
    profiles: ["loadtest"]
    environment:
      API_URL: http://api:3000/v1
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-compose-admin-key-change-this}
      VUS: ${VUS:-20}
      DURATION: ${DURATION:-30s}
      ACCOUNTS: ${ACCOUNTS:-1}
      ALLOWANCE: ${ALLOWANCE:-1000000000}
      UNITS: ${UNITS:-1}
      DUP_RATE: ${DUP_RATE:-0}
      CONSUME_LOCK_TIMEOUT_MS: ${CONSUME_LOCK_TIMEOUT_MS:-1000}
      CONSUME_STATEMENT_TIMEOUT_MS: ${CONSUME_STATEMENT_TIMEOUT_MS:-30000}
    volumes:
      - ./loadtest:/scripts:ro
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["k6"]

volumes:
  postgres_data:
