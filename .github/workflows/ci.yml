name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: usage_metering
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: usage_metering
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usage_metering -d usage_metering"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Run tests (require zero skipped)
        env:
          TEST_DATABASE_URL: postgres://usage_metering:test_password@localhost:5432/usage_metering
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/npm-test-output.txt"
          grep -Eq 'skipped 0' "$RUNNER_TEMP/npm-test-output.txt"
